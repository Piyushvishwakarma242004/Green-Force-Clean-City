<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Green Force, Clean City!</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#f5f5f5;padding:100px 20px 20px}
  .navbar{background:#fff;padding:1.5rem 2rem;position:fixed;top:0;left:0;width:100%;z-index:1000;box-shadow:0 4px 15px rgba(0,0,0,.05)}
  .nav-container{max-width:1300px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
  .nav-brand{color:#27ae60;font-size:2rem;font-weight:700;text-decoration:none}
  .nav-menu{display:flex;gap:2rem}
  .nav-item{color:#333;text-decoration:none;font-weight:500}
  .nav-item:hover{color:#27ae60}
  .container{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,.1)}
  h2{text-align:center;color:#333;margin-bottom:16px}
  .status-box{display:flex;gap:10px;margin-bottom:16px}
  .box{flex:1;text-align:center;padding:14px;border-radius:5px;color:#fff;font-weight:bold}
  .issued{background:#e74c3c}.verified{background:#8e44ad}.in-progress{background:#f39c12}.solved{background:#2ecc71}
  input,select,button{padding:9px 11px;border:1px solid #ccc;border-radius:6px;font-size:1rem}
  button{background:#27ae60;color:#fff;border:none;cursor:pointer;font-weight:600}
  button.red{background:#e74c3c}button.grey{background:#7f8c8d}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .row input{flex:1;min-width:160px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top;font-size:.92rem}
  th{background:#3498db;color:#fff}
  td img{width:70px;height:50px;object-fit:cover;border-radius:4px}
  .act{display:flex;flex-direction:column;gap:6px;min-width:170px}
  #loginBox{max-width:380px;margin:auto}
  #loginBox input{width:100%;margin-bottom:10px}
  #err{color:#c0392b;text-align:center;margin:8px}
  .pager{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:14px}
  .hidden{display:none}
  .table-wrap{overflow-x:auto}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-container">
  <a href="#" class="nav-brand">Green Force, Clean City!</a>
  <div class="nav-menu">
    <a href="home.html" class="nav-item">Home</a>
    <a href="Report.html" class="nav-item">Report Issue</a>
    <a href="Track.html" class="nav-item">Track Issues</a>
    <a href="Admin.html" class="nav-item">Admin</a>
    <a href="contact.html" class="nav-item">Contact</a>
    <a href="Login.html" class="nav-item">Login</a>
  </div>
</div></nav>

<div class="container">
  <h2>Admin Panel (live data)</h2>
  <div id="err"></div>

  <div id="loginBox">
    <input id="email" name="email" type="email" placeholder="Admin email" autocomplete="username">
    <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" style="width:100%">Login as admin</button>
  </div>

  <div id="panel" class="hidden">
    <div class="row">
      <span id="who" style="flex:1;align-self:center;color:#555"></span>
      <button class="grey" id="logout">Logout</button>
    </div>

    <div class="status-box">
      <div class="box issued">Issued: <span id="cIssued">0</span></div>
      <div class="box verified">Verified: <span id="cVer">0</span></div>
      <div class="box in-progress">In Progress: <span id="cProg">0</span></div>
      <div class="box solved">Solved: <span id="cSolved">0</span></div>
    </div>

    <div class="row">
      <select id="fStatus">
        <option value="">All statuses</option>
        <option value="ISSUED">Issued</option>
        <option value="VERIFIED">Verified</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="SOLVED">Solved</option>
      </select>
      <input id="fQ" placeholder="Search description / category / location / code">
      <button id="fBtn">Filter</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Photo</th><th>Issue</th><th>Reporter</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager">
      <button class="grey" id="prev">Previous</button><span id="pageInfo"></span><button class="grey" id="next">Next</button>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = GF.getToken();
  var page = 0, totalPages = 0;

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = text;   // never innerHTML with user text
    if (cls) e.className = cls;
    return e;
  }
  function err(t) { $('err').textContent = t || ''; }

  function api(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, opts).then(function (r) {
      if (r.status === 401 || r.status === 403) {
        if (token) logout();
        return r.json().catch(function () { return {}; }).then(function (d) { throw new Error(d.message || 'Admin login required'); });
      }
      if (r.status === 204) return null;
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.message || ('Error ' + r.status));
        return d;
      });
    });
  }

  function showPanel(on) {
    $('panel').classList.toggle('hidden', !on);
    $('loginBox').classList.toggle('hidden', on);
  }

  function logout() {
    token = null; GF.clear(); showPanel(false);
  }

  function login() {
    err('');
    api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: $('email').value, password: $('password').value }) })
      .then(function (d) {
        if (d.role !== 'ADMIN') throw new Error('This account is not an admin');
        token = d.token; GF.setSession(d);
        $('password').value = '';
        window.location.reload();   // redraw the navbar with the new (admin) session
      }).catch(function (e) { err(e.message); });
  }

  function refresh() { loadStats(); load(); }

  function loadStats() {
    api('/api/issues/stats').then(function (s) {
      $('cIssued').textContent = s.issued; $('cVer').textContent = s.verified; $('cProg').textContent = s.inProgress; $('cSolved').textContent = s.solved;
    }).catch(function () {});
  }

  function load() {
    err('');
    var p = new URLSearchParams();
    if ($('fStatus').value) p.set('status', $('fStatus').value);
    if ($('fQ').value.trim()) p.set('q', $('fQ').value.trim());
    p.set('page', page); p.set('size', 15);
    api('/api/admin/issues?' + p.toString()).then(function (d) {
      var tb = $('rows'); tb.textContent = '';
      d.content.forEach(function (i) { tb.appendChild(row(i)); });
      totalPages = d.totalPages;
      $('pageInfo').textContent = d.totalElements === 0 ? 'No issues' : 'Page ' + (d.page + 1) + ' of ' + d.totalPages;
      $('prev').disabled = d.page <= 0; $('next').disabled = d.page + 1 >= d.totalPages;
    }).catch(function (e) { err(e.message); });
  }

  function row(i) {
    var tr = el('tr');
    tr.appendChild(el('td', i.id));
    var tdImg = el('td');
    if (i.imageUrl) { var im = el('img'); im.src = i.imageUrl; im.alt = ''; tdImg.appendChild(im); }
    tr.appendChild(tdImg);

    var tdIssue = el('td');
    tdIssue.appendChild(el('strong', i.category));
    tdIssue.appendChild(el('div', i.description));
    tdIssue.appendChild(el('div', i.trackingCode + (i.location ? ' | ' + i.location : '')));
    tr.appendChild(tdIssue);

    tr.appendChild(el('td', (i.reporterName || '-') + (i.reporterEmail ? ' (' + i.reporterEmail + ')' : '')));
    tr.appendChild(el('td', i.status));

    var tdAct = el('td'); var act = el('div', null, 'act');
    var sel = el('select');
    [['ISSUED', 'Issued'], ['VERIFIED', 'Verified'], ['IN_PROGRESS', 'In Progress'], ['SOLVED', 'Solved']].forEach(function (o) {
      var op = el('option', o[1]); op.value = o[0]; if (o[0] === i.statusCode) op.selected = true; sel.appendChild(op);
    });
    var note = el('input'); note.placeholder = 'Note (optional)';
    var save = el('button', 'Update status');
    save.onclick = function () {
      if (sel.value === i.statusCode) { err('Pick a different status first'); return; }
      api('/api/admin/issues/' + i.id + '/status', { method: 'PATCH', body: JSON.stringify({ status: sel.value, note: note.value }) })
        .then(refresh).catch(function (e) { err(e.message); });
    };
    var del = el('button', 'Delete', 'red');
    del.onclick = function () {
      if (!confirm('Delete issue ' + i.trackingCode + ' permanently?')) return;
      api('/api/admin/issues/' + i.id, { method: 'DELETE' }).then(refresh).catch(function (e) { err(e.message); });
    };
    [sel, note, save, del].forEach(function (x) { act.appendChild(x); });
    tdAct.appendChild(act); tr.appendChild(tdAct);
    return tr;
  }

  $('loginBtn').onclick = login;
  $('password').onkeydown = function (e) { if (e.key === 'Enter') login(); };
  $('logout').onclick = logout;
  $('fBtn').onclick = function () { page = 0; load(); };
  $('prev').onclick = function () { if (page > 0) { page--; load(); } };
  $('next').onclick = function () { if (page + 1 < totalPages) { page++; load(); } };

  if (token) {
    api('/api/auth/me').then(function (u) {
      if (u.role !== 'ADMIN') throw new Error('not admin');
      $('who').textContent = 'Logged in as ' + u.email; showPanel(true); refresh();
    }).catch(function () { token = null; showPanel(false); });
  }
})();
</script>
</body>
</html>
