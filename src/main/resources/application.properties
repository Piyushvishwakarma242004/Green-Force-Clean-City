spring.application.name=green-force-backend
server.port=8080

# ---------- Database (default: H2 file DB, zero setup) ----------
# For MySQL run with:  --spring.profiles.active=mysql   (see application-mysql.properties)
spring.datasource.url=jdbc:h2:file:./data/greenforce
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Uploads (Report.html sends an image) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=${UPLOAD_DIR:./uploads}

# ---------- Security ----------
# Must be at least 32 characters. CHANGE THIS (set env var JWT_SECRET) before deploying.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# Comma separated origins allowed to call the API from another origin (not needed when
# the HTML is served by this app itself).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# Firebase project used by Login.html (this value is public, it is in the frontend too)
app.firebase.project-id=forged-in-code-4beed

# First admin account, created on startup if it does not exist yet
app.admin.name=Administrator
app.admin.email=${ADMIN_EMAIL:admin@greenforce.local}
app.admin.password=${Admin@12345}
